name: Audit public Wordleaf release inventory

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout release repository without downloading installer binaries
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      - name: Run inventory regression tests
        run: python3 -m unittest discover -s scripts -p 'test_public_release_inventory.py' -v

      - name: Reject unpublished projects and source/secret assets
        run: python3 scripts/check-public-release-inventory.py
